<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis Contactos | AppKinal</title>
    <link rel="stylesheet" href="../CSS/contactos.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../CSS/compartido.css">
    <link rel="icon" href="../img/iconoagenda.png" type="image/png">
</head>
<body>
    <div class="container">
        <header class="header">
            <div class="logo">
                <i class="fas fa-address-book"></i>
                <h1>Mi Agenda</h1>
            </div>
            <div class="user-info">
                <span id="userName"></span>
                <a href="../HTML/perfil.html" class="profile-link">
                    <i class="fas fa-user-circle"></i>
                </a>
            </div>
        </header>
        
        <nav class="sidebar">
            <ul class="nav-menu">
                <li class="nav-item active">
                    <a href="../HTML/contactos.html">
                        <i class="fas fa-users"></i>
                        <span>Contactos</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="../HTML/favoritos.html">
                        <i class="fas fa-star"></i>
                        <span>Favoritos</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="../HTML/todo-list.html">
                        <i class="fas fa-tasks"></i>
                        <span>To-Do List</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="../HTML/index.html" class="logout">
                        <i class="fas fa-sign-out-alt"></i>
                        <span>Cerrar Sesión</span>
                    </a>
                </li>
            </ul>
        </nav>
        
        <main class="main-content">
            <div class="content-header">
                <h2><i class="fas fa-users"></i> Mis Contactos</h2>
                <a href="../HTML/nuevo-contacto.html" class="btn-add">
                    <i class="fas fa-plus-circle"></i> Nuevo Contacto
                </a>
            </div>
            
            <div class="contacts-grid" id="contactsList">
                <!-- Los contactos se cargarán aquí con el JavaScript -->
            </div>
            
            <div class="notebook-lines"></div>
        </main>
        
        <div class="floating-btn">
            <a href="../HTML/nuevo-contacto.html" class="fab">
                <i class="fas fa-plus"></i>
            </a>
        </div>
    </div>
    
    <script src="../js/contactos.js"></script>
    <script src="../js/compartido.js"></script>
</body>
</html>
