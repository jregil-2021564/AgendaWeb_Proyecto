<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Nuevo Contacto | AppKinal</title>
        <link rel="stylesheet" href="../CSS/nuevo-contacto.css">
        <link rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
        <link rel="stylesheet" href="../CSS/compartido.css">
        <link rel="icon" href="../img/iconoagenda.png" type="image/png">
    </head>
    <body>
        <div class="container">
            <header class="header">
                <div class="logo">
                    <i class="fas fa-address-book"></i>
                    <h1>Mi Agenda</h1>
                </div>
                <div class="user-info">
                    <span id="userName"></span>
                    <a href="../HTML/perfil.html" class="profile-link">
                        <i class="fas fa-user-circle"></i>
                    </a>
                </div>
            </header>

            <nav class="sidebar">
                <ul class="nav-menu">
                    <li class="nav-item">
                        <a href="../HTML/contactos.html">
                            <i class="fas fa-users"></i>
                            <span>Contactos</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="../HTML/favoritos.html">
                            <i class="fas fa-star"></i>
                            <span>Favoritos</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="../HTML/todo-list.html">
                            <i class="fas fa-tasks"></i>
                            <span>To-Do List</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="../HTML/index.html" class="logout">
                            <i class="fas fa-sign-out-alt"></i>
                            <span>Cerrar Sesión</span>
                        </a>
                    </li>
                </ul>
            </nav>

            <main class="main-content">
                <div class="content-header">
                    <h2><i class="fas fa-user-plus"></i> Nuevo Contacto</h2>
                    <a href="../HTML/contactos.html" class="btn-back">
                        <i class="fas fa-arrow-left"></i> Volver
                    </a>
                </div>

                <div class="form-container">
                    <form id="contactForm">
                        <div class="form-grid">
                            <div class="form-group">
                                <label for="nombre">
                                    <i class="fas fa-user"></i> Nombre Completo
                                    *
                                </label>
                                <input type="text" id="nombre" name="nombre"
                                    required
                                    placeholder="Ej: Juan Pérez López">
                            </div>

                            <div class="form-group">
                                <label for="telefono">
                                    <i class="fas fa-phone"></i> Teléfono *
                                </label>
                                <input type="tel" id="telefono" name="telefono"
                                    required
                                    placeholder="Ej: +502 87453214">
                            </div>

                            <div class="form-group">
                                <label for="correo">
                                    <i class="fas fa-envelope"></i> Correo
                                    Electrónico
                                </label>
                                <input type="email" id="correo" name="correo"
                                    placeholder="Ej: juan.perez@gmail.com">
                            </div>

                            <div class="form-group">
                                <label for="empresa">
                                    <i class="fas fa-building"></i> Empresa
                                </label>
                                <input type="text" id="empresa" name="empresa"
                                    placeholder="Ej: Tech Solutions S.A.">
                            </div>

                            <div class="form-group full-width">
                                <label for="direccion">
                                    <i class="fas fa-map-marker-alt"></i>
                                    Dirección
                                </label>
                                <input type="text" id="direccion"
                                    name="direccion"
                                    placeholder="Ej: Guatemala, Zona 10">
                            </div>

                            <div class="form-group">
                                <label for="fechaNacimiento">
                                    <i class="fas fa-birthday-cake"></i> Fecha
                                    de Nacimiento
                                </label>
                                <input type="date" id="fechaNacimiento"
                                    name="fechaNacimiento">
                            </div>

                            <div class="form-group">
                                <label for="categoria">
                                    <i class="fas fa-tag"></i> Categoría
                                </label>
                                <select id="categoria" name="categoria">
                                    <option value>Seleccionar categoría</option>
                                    <option value="familia">Familia</option>
                                    <option value="amigos">Amigos</option>
                                    <option value="trabajo">Trabajo</option>
                                    <option value="estudios">Estudios</option>
                                    <option value="otros">Otros</option>
                                </select>
                            </div>

                            <div class="form-group full-width">
                                <label for="notas">
                                    <i class="fas fa-sticky-note"></i> Notas
                                    Adicionales
                                </label>
                                <textarea id="notas" name="notas" rows="4"
                                    placeholder="Notas o información adicional sobre el contacto..."></textarea>
                            </div>

                            <div class="form-group">
                                <div class="checkbox-group">
                                    <input type="checkbox" id="favorito"
                                        name="favorito">
                                    <label for="favorito">
                                        <i class="fas fa-star"></i> Marcar como
                                        favorito
                                    </label>
                                </div>
                            </div>
                        </div>

                        <div class="form-actions">
                            <button type="button" class="btn-cancel"
                                onclick="window.history.back()">
                                <i class="fas fa-times"></i> Cancelar
                            </button>
                            <button type="submit" class="btn-submit">
                                <i class="fas fa-save"></i> Guardar Contacto
                            </button>
                        </div>
                    </form>
                </div>

                <div class="notebook-lines"></div>
            </main>
        </div>

        <script src="../js/nuevo-contacto.js"></script>
        <script src="../js/compartido.js"></script>
    </body>
</html>
