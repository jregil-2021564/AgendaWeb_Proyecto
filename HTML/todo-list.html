<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Tareas | AppKinal</title>
    <link rel="stylesheet" href="../CSS/todo-list.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../CSS/compartido.css">
    <link rel="icon" href="../img/iconoagenda.png" type="image/png">
</head>
<body>
    <div class="container">
        <header class="header">
            <div class="logo">
                <i class="fas fa-address-book"></i>
                <h1>Mi Agenda</h1>
            </div>
            <div class="user-info">
                <span id="userName"></span>
                <a href="../HTML/perfil.html" class="profile-link">
                    <i class="fas fa-user-circle"></i>
                </a>
            </div>
        </header>
        
        <nav class="sidebar">
            <ul class="nav-menu">
                <li class="nav-item">
                    <a href="../HTML/contactos.html">
                        <i class="fas fa-users"></i>
                        <span>Contactos</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="../HTML/favoritos.html">
                        <i class="fas fa-star"></i>
                        <span>Favoritos</span>
                    </a>
                </li>
                <li class="nav-item active">
                    <a href="../HTML/todo-list.html">
                        <i class="fas fa-tasks"></i>
                        <span>To-Do List</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="../HTML/index.html" class="logout">
                        <i class="fas fa-sign-out-alt"></i>
                        <span>Cerrar Sesión</span>
                    </a>
                </li>
            </ul>
        </nav>
        
        <main class="main-content">
            <div class="content-header">
                <h2><i class="fas fa-tasks"></i> Mi Lista de Tareas</h2>
                <div class="stats">
                    <span class="stat-item">
                        <i class="fas fa-list-check"></i>
                        <span id="totalTasks">0</span> tareas
                    </span>
                    <span class="stat-item">
                        <i class="fas fa-check-circle"></i>
                        <span id="completedTasks">0</span> completadas
                    </span>
                </div>
            </div>
            
            <div class="todo-container">
                <div class="todo-form">
                    <div class="form-row">
                        <input type="text" id="taskInput" placeholder="Escribe una nueva tarea..." maxlength="100">
                        <select id="prioritySelect">
                            <option value="alta">Alta Prioridad</option>
                            <option value="media" selected>Media Prioridad</option>
                            <option value="baja">Baja Prioridad</option>
                        </select>
                        <button id="addTaskBtn" class="btn-add-task">
                            <i class="fas fa-plus"></i> Agregar
                        </button>
                    </div>
                </div>
                
                <div class="todo-filters">
                    <button class="filter-btn active" data-filter="todas">Todas</button>
                    <button class="filter-btn" data-filter="pendientes">Pendientes</button>
                    <button class="filter-btn" data-filter="completadas">Completadas</button>
                    <div class="sort-options">
                        <span>Ordenar por:</span>
                        <select id="sortSelect">
                            <option value="fecha">Fecha</option>
                            <option value="prioridad">Prioridad</option>
                            <option value="nombre">Nombre</option>
                        </select>
                    </div>
                </div>
                
                <div class="todo-list" id="tasksList">

                </div>
                
                <div class="empty-state" id="emptyState">
                    <div class="empty-icon">
                        <i class="fas fa-clipboard-list"></i>
                    </div>
                    <h3>No hay tareas pendientes</h3>
                    <p>¡Agrega tu primera tarea para comenzar!</p>
                </div>
            </div>
            
            <div class="notebook-lines"></div>
        </main>
        
        <div class="floating-btn">
            <button class="fab" id="fabAddTask">
                <i class="fas fa-plus"></i>
            </button>
        </div>
    </div>
    
    <script src="../js/todo-list.js"></script>
    <script src="../js/compartido.js"></script>
</body>
</html>
